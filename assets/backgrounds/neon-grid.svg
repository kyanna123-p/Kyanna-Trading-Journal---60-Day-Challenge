<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none" role="img" aria-label="Subtle violet and magenta neon grid overlay">
  <defs>
    <pattern id="minor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#9C69E9" stroke-width=".7" stroke-opacity=".105"/>
    </pattern>
    <pattern id="major" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" stroke="#D66EFF" stroke-width="1.2" stroke-opacity=".13"/>
    </pattern>
    <radialGradient id="purple" cx="0" cy="0" r="1" gradientTransform="translate(670 140) rotate(140) scale(540)">
      <stop stop-color="#9E38EE" stop-opacity=".21"/>
      <stop offset=".46" stop-color="#6E20C9" stop-opacity=".075"/>
      <stop offset="1" stop-color="#6E20C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0" cy="0" r="1" gradientTransform="translate(90 700) rotate(-38) scale(500)">
      <stop stop-color="#FF42CC" stop-opacity=".115"/>
      <stop offset="1" stop-color="#FF42CC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E063FF" stop-opacity="0"/>
      <stop offset=".52" stop-color="#E063FF" stop-opacity=".11"/>
      <stop offset="1" stop-color="#E063FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Transparent background so the atmosphere image remains visible. -->
  <path fill="url(#minor)" d="M0 0H800V800H0z"/>
  <path fill="url(#major)" d="M0 0H800V800H0z"/>
  <path fill="url(#purple)" d="M0 0H800V800H0z"/>
  <path fill="url(#pink)" d="M0 0H800V800H0z"/>
  <path d="M0 798 798 0" stroke="url(#beam)" stroke-width="1"/>
  <g fill="#E6B1FF">
    <circle cx="200" cy="200" r="1.5" opacity=".25"/>
    <circle cx="600" cy="400" r="1.4" opacity=".2"/>
    <circle cx="400" cy="600" r="1.5" opacity=".18"/>
  </g>
</svg>
