<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="title desc">
<title id="title">Kyanna Trading OS crowned lion</title><desc id="desc">Full uncropped regal lion head with golden crown, amethyst mane and neon pink and gold highlights on a transparent background.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff6c6"/><stop offset=".24" stop-color="#ffd17c"/><stop offset=".57" stop-color="#db8c36"/><stop offset="1" stop-color="#7b3b20"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ed8de9"/><stop offset=".3" stop-color="#a94cbe"/><stop offset=".65" stop-color="#4b236e"/><stop offset="1" stop-color="#140e2d"/></linearGradient>
 <linearGradient id="fur" x1=".12" y1="0" x2=".9" y2="1"><stop stop-color="#f7c37d"/><stop offset=".28" stop-color="#b97a61"/><stop offset=".64" stop-color="#67405f"/><stop offset="1" stop-color="#27152e"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4c18b"/><stop offset=".44" stop-color="#b47b72"/><stop offset=".75" stop-color="#72516a"/><stop offset="1" stop-color="#38233d"/></linearGradient>
 <radialGradient id="gem"><stop stop-color="#ffd4ff"/><stop offset=".35" stop-color="#e45bea"/><stop offset="1" stop-color="#5a1e8a"/></radialGradient>
 <filter id="halo" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
