<use href="#club" fill="url(#amethyst)" stroke="#5b1a65" stroke-width="15" stroke-linejoin="round"/>
<use href="#club" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>
<use href="#club" fill="none" stroke="#ffe5a0" stroke-width="2" opacity=".9"/>
