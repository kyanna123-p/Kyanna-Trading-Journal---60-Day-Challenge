<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 490" role="img" aria-labelledby="title desc">
<title id="title">Kyanna crowned neon club</title><desc id="desc">Complete gold-outlined purple club emblem with a jeweled crown, neon glow, and ornamental light trails on transparent background.</desc>
<defs>
 <linearGradient id="gold" x1=".1" y1="0" x2=".9" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#fff5bf"/><stop offset=".2" stop-color="#ffcf72"/><stop offset=".48" stop-color="#ef9c36"/><stop offset=".72" stop-color="#fff0a1"/><stop offset="1" stop-color="#ad5721"/></linearGradient>
 <radialGradient id="amethyst" cx="50%" cy="48%" r="63%"><stop stop-color="#ae36d9"/><stop offset=".36" stop-color="#5e178b"/><stop offset=".72" stop-color="#240d40"/><stop offset="1" stop-color="#0c081d"/></radialGradient>
 <radialGradient id="innerGlow"><stop stop-color="#ff91f9" stop-opacity=".9"/><stop offset=".3" stop-color="#b62aff" stop-opacity=".48"/><stop offset="1" stop-color="#6410b9" stop-opacity="0"/></radialGradient>
 <filter id="aura" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="shine" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
 <path id="club" d="M210 109 C158 109 128 148 128 194 C128 207 131 221 137 233 C122 225 105 221 88 221 C47 221 24 256 24 293 C24 336 58 371 101 371 C130 371 151 360 171 342 C169 376 152 410 124 436 L296 436 C268 410 251 376 249 342 C269 360 290 371 319 371 C362 371 396 336 396 293 C396 256 373 221 332 221 C315 221 298 225 283 233 C289 221 292 207 292 194 C292 148 262 109 210 109 Z"/>
</defs>
